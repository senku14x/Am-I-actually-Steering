[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strat-geom"
version = "0.0.1"
description = "Falsification-first study of difference-of-means 'behavioral directions' in reasoning models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Vishesh Gupta" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# GPU host only — generation + activation extraction + interventions
gpu = ["torch>=2.2", "transformers>=4.44", "accelerate", "tqdm"]
# LLM annotation / judge
annotate = ["openai>=1.0", "pydantic>=2.0"]
dev = ["pytest>=7.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/strat_geom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]
