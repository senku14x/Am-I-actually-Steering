# Base config. Paths use ${env:VAR:default}. Model-specific configs override on top.
seed: 42

# Data + outputs (env-overridable so the same config works on any host)
data_dir: ${env:DATA_ROOT:./data}
results_dir: ${env:RESULTS_ROOT:./results}

# Fixed 10-label taxonomy (D6: frozen for the geometry analysis)
labels:
  - opponent_modeling
  - iterated_reasoning
  - equilibrium_identification
  - payoff_analysis
  - strategic_uncertainty
  - cooperative_reasoning
  - initialization
  - deduction
  - backtracking
  - none_other

# Geometry / Stage-A analysis
think_only: true        # restrict to think-region segments
min_count: 20           # min segments per label to include in DoM/calibration
headline_pair: [opponent_modeling, deduction]

# Stage-A null / bootstrap sizes
n_permutation: 1000
n_bootstrap: 1000
n_seeds: 3

# LLM judge / annotator (SPEC §2.3). OpenAI-COMPATIBLE, so this is also how you use an open model
# (DeepSeek / Qwen / GLM / Llama) served via vLLM locally or DeepInfra/Together/Fireworks — just set
# JUDGE_MODEL + JUDGE_BASE_URL. Independence rule: the PRIMARY judge should be a DIFFERENT lineage
# than the subject model (don't judge DeepSeek-R1-Distill-Qwen chains with a DeepSeek/Qwen judge —
# use that as the independent SECOND judge for κ instead, SPEC §5-B6).
judge:
  provider: openai_compatible
  model: ${env:JUDGE_MODEL:gpt-4o-mini}
  base_url: ${env:JUDGE_BASE_URL:}     # empty = OpenAI; e.g. http://localhost:8000/v1 for local vLLM
  api_key_env: JUDGE_API_KEY           # falls back to OPENAI_API_KEY; "EMPTY" for keyless local servers
  temperature: 0
