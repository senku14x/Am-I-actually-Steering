# Base config. Paths use ${env:VAR:default}. Model-specific configs override on top.
seed: 42

# Data + outputs (env-overridable so the same config works on any host)
data_dir: ${env:DATA_ROOT:./data}
results_dir: ${env:RESULTS_ROOT:./results}

# Fixed 10-label taxonomy (D6: frozen for the geometry analysis)
labels:
  - opponent_modeling
  - iterated_reasoning
  - equilibrium_identification
  - payoff_analysis
  - strategic_uncertainty
  - cooperative_reasoning
  - initialization
  - deduction
  - backtracking
  - none_other

# Geometry / Stage-A analysis
think_only: true        # restrict to think-region segments
min_count: 20           # min segments per label to include in DoM/calibration
headline_pair: [opponent_modeling, deduction]

# Stage-A null / bootstrap sizes
n_permutation: 1000
n_bootstrap: 1000
n_seeds: 3

# LLM judge / annotator (SPEC §2.3) — defaults to OpenRouter (one key, every open model). Pick CHEAP
# open models by slug from openrouter.ai/models (many have a rate-limited ":free" tier). Independence
# rule (we're testing for an annotation artifact, so this matters): the PRIMARY annotator should be a
# DIFFERENT lineage than the subject — avoid Qwen/DeepSeek/Llama/Phi judges on those subjects; use a
# second, different-lineage cheap model as the κ judge (SPEC §5-B6). Run `annotate` once per judge
# (annotations are saved per-judge) and compute κ between the two files.
judge:
  provider: openrouter
  model: ${env:JUDGE_MODEL:google/gemma-2-27b-it}       # set to a CURRENT openrouter.ai/models slug
  base_url: ${env:JUDGE_BASE_URL:https://openrouter.ai/api/v1}
  api_key_env: OPENROUTER_API_KEY                        # falls back to JUDGE_API_KEY / OPENAI_API_KEY
  temperature: 0
  http_referer: ${env:OPENROUTER_REFERER:}              # optional OpenRouter attribution headers
  x_title: ${env:OPENROUTER_TITLE:strat-geom}
