# Base config. Paths use ${env:VAR:default}. Model-specific configs override on top.
seed: 42

# Data + outputs (env-overridable so the same config works on any host)
data_dir: ${env:DATA_ROOT:./data}
results_dir: ${env:RESULTS_ROOT:./results}

# Fixed 10-label taxonomy (D6: frozen for the geometry analysis)
labels:
  - opponent_modeling
  - iterated_reasoning
  - equilibrium_identification
  - payoff_analysis
  - strategic_uncertainty
  - cooperative_reasoning
  - initialization
  - deduction
  - backtracking
  - none_other

# Geometry / Stage-A analysis
think_only: true        # restrict to think-region segments
min_count: 20           # min segments per label to include in DoM/calibration
headline_pair: [opponent_modeling, deduction]

# Stage-A null / bootstrap sizes
n_permutation: 1000
n_bootstrap: 1000
n_seeds: 3

# LLM judge / annotator (SPEC §2.3) — OpenRouter. Use strong-but-cheap open models; current good
# picks (mid-2026): z-ai/glm-4.6, qwen/qwen3.5-27b, deepseek/deepseek-v3.2 — all ~frontier at
# cents/Mtok, all hold a 10-label taxonomy fine. Robustness, not purity: run `annotate` with TWO
# DIFFERENT-family judges and report κ (SPEC §5-B6); annotations are saved per-judge. Mild caveat:
# the subjects are DeepSeek-R1 distills of Qwen/Llama, so keeping the PRIMARY judge off those vendors
# (GLM is a clean default) makes the headline cross-model result easiest to defend — demote a
# Qwen/DeepSeek judge to the κ check rather than the headline.
judge:
  provider: openrouter
  model: ${env:JUDGE_MODEL:z-ai/glm-4.6}                # any current openrouter.ai/models slug
  base_url: ${env:JUDGE_BASE_URL:https://openrouter.ai/api/v1}
  api_key_env: OPENROUTER_API_KEY                        # falls back to JUDGE_API_KEY / OPENAI_API_KEY
  temperature: 0
  http_referer: ${env:OPENROUTER_REFERER:}              # optional OpenRouter attribution headers
  x_title: ${env:OPENROUTER_TITLE:strat-geom}
